<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    width: 220px;
    padding: 20px 16px 16px;
    font-family: system-ui, -apple-system, sans-serif;
    background: #0f1520;
    color: #e0e8ff;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
  }

  .logo svg { flex-shrink: 0; }

  .logo h1 {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.01em;
  }

  p {
    font-size: 12px;
    color: #7a90b0;
    margin-bottom: 14px;
    line-height: 1.5;
  }

  button {
    width: 100%;
    padding: 10px;
    background: #3b7ff5;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
  }

  button:hover { background: #2a6de0; }
  button:active { background: #1f5cc0; }

  .shortcut {
    margin-top: 10px;
    font-size: 11px;
    color: #3a5070;
    text-align: center;
  }

  kbd {
    background: #1a2540;
    border: 1px solid #2a3d5c;
    border-radius: 4px;
    padding: 1px 5px;
    font-size: 10px;
    font-family: monospace;
    color: #6090c0;
  }
</style>
</head>
<body>
  <div class="logo">
    <svg width="28" height="28" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect width="28" height="28" rx="7" fill="#1a2f55"/>
      <path d="M7 7h5v2H9v2H7V7zM16 7h5v4h-2V9h-3V7zM7 16h2v3h3v2H7v-5zM19 19h-3v2h5v-5h-2v3z" fill="#4f9eff"/>
      <rect x="11" y="11" width="6" height="6" rx="1" fill="#4f9eff" opacity="0.4"/>
    </svg>
    <h1>SnipText</h1>
  </div>

  <p>Drag over any text on screen to copy it instantly.</p>

  <button id="snipBtn">✂️ &nbsp;Start Snipping</button>

  <div class="shortcut">or press <kbd>Ctrl+Shift+X</kbd></div>

  <script src="popup.js"></script>
</body>
</html>
