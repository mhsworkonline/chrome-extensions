<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bulk Email Reply</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup">

    <!-- Header -->
    <div class="popup-header">
      <div class="popup-logo">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
          <polyline points="22,6 12,13 2,6"/>
        </svg>
      </div>
      <div class="popup-title-group">
        <h1 class="popup-title">Bulk Email Reply</h1>
        <span class="popup-version">v1.0.0</span>
      </div>
    </div>

    <!-- Auth section -->
    <div class="auth-section" id="auth-section">
      <div class="auth-status" id="auth-status">
        <div class="status-dot" id="status-dot"></div>
        <span id="status-text">Not connected</span>
      </div>
      <div id="user-email-display" class="user-email" style="display:none"></div>
      <button class="btn btn-primary" id="signin-btn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
        Connect Gmail
      </button>
      <button class="btn btn-ghost" id="signout-btn" style="display:none">
        Sign out
      </button>
    </div>

    <div class="divider"></div>

    <!-- Settings tabs -->
    <div class="tabs">
      <button class="tab active" data-tab="ai">AI Settings</button>
      <button class="tab" data-tab="templates">Templates</button>
      <button class="tab" data-tab="bcc">BCC/Auto</button>
    </div>

    <!-- AI Settings -->
    <div class="tab-panel active" id="tab-ai">
      <div class="field-group">
        <label class="field-label">
          OpenAI API Key
          <span class="badge">Required for AI Generate</span>
        </label>
        <div class="input-row">
          <input type="password" class="field-input" id="openai-key" placeholder="sk-...">
          <button class="icon-btn" id="toggle-key-vis" title="Show/hide">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <p class="field-hint">Used to generate smart AI replies. Your key is stored locally.</p>
      </div>

      <div class="field-group">
        <label class="field-label">Default Reply Tone</label>
        <select class="field-input" id="default-tone">
          <option value="professional">Professional</option>
          <option value="friendly">Friendly</option>
          <option value="concise">Concise</option>
          <option value="formal">Formal</option>
        </select>
      </div>
    </div>

    <!-- Templates -->
    <div class="tab-panel" id="tab-templates">
      <div class="templates-list" id="templates-list">
        <!-- Populated by JS -->
      </div>
      <button class="btn btn-ghost btn-sm" id="add-template-btn">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Add Template
      </button>

      <!-- Add template form (hidden by default) -->
      <div class="add-form" id="add-template-form" style="display:none">
        <input type="text" class="field-input" id="new-tpl-name" placeholder="Template name">
        <textarea class="field-input tpl-textarea" id="new-tpl-body" placeholder="Template body..."></textarea>
        <div class="form-btns">
          <button class="btn btn-primary btn-sm" id="save-template-btn">Save</button>
          <button class="btn btn-ghost btn-sm" id="cancel-template-btn">Cancel</button>
        </div>
      </div>
    </div>

    <!-- BCC / Auto -->
    <div class="tab-panel" id="tab-bcc">
      <div class="field-group">
        <label class="field-label">
          Default BCC Address
          <span class="badge">Gmail Auto BCC</span>
        </label>
        <input type="email" class="field-input" id="default-bcc" placeholder="crm@yourcompany.com">
        <p class="field-hint">Automatically BCC'd on all bulk replies. Useful for CRM sync.</p>
      </div>

      <div class="field-group">
        <label class="field-label">Default Action Mode</label>
        <div class="radio-group">
          <label class="radio-item">
            <input type="radio" name="default-mode" value="send" checked>
            <span>Send immediately</span>
          </label>
          <label class="radio-item">
            <input type="radio" name="default-mode" value="draft">
            <span>Save as drafts</span>
          </label>
        </div>
      </div>
    </div>

    <!-- Save button -->
    <div class="popup-footer">
      <button class="btn btn-primary full-width" id="save-btn">
        Save Settings
      </button>
      <div class="save-status" id="save-status"></div>
    </div>

  </div>

  <script src="popup.js"></script>
</body>
</html>
